services:
  postgres:
    # Same major as the staging and production Coolify resources, so a migration that only
    # works on a newer Postgres fails here first rather than on the staging deploy.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fantasy
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
