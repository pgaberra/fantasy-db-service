spring:
  application:
    name: fantasy-db-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fantasy}
    username: ${DB_USER:fantasy}
    # No default — the password is always supplied via the DB_PASSWORD env var
    # (Render in prod; your shell locally). Never commit a password here.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

internal:
  api-key: ${INTERNAL_API_KEY:}

projections:
  # The season new projections are stamped with. Non-secret; override per environment.
  current-season: ${CURRENT_SEASON:20262027}

server:
  port: ${PORT:8086}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
