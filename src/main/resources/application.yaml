spring:
  application:
    name: fantasy-db-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fantasy}
    username: ${DB_USER:fantasy}
    password: ${DB_PASSWORD:fantasy}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8086}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
