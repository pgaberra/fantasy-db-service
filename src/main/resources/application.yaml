spring:
  application:
    name: fantasy-db-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fantasy}
    username: ${DB_USER:fantasy}
    # No default — the password is always supplied via the DB_PASSWORD env var
    # (Coolify in the deployed envs; your shell locally). Never commit a password here.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

internal:
  # Required in every environment: the app refuses to start if this is blank, so it never serves
  # an unauthenticated internal API (this service returns password hashes). Set INTERNAL_API_KEY
  # when running locally too; tests supply their own key.
  api-key: ${INTERNAL_API_KEY:}

projections:
  # The season new projections are stamped with. Non-secret; override per environment.
  current-season: ${CURRENT_SEASON:20262027}

security:
  password-reset:
    # How long an issued password reset token stays valid. Non-secret; ISO-8601 duration.
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}

server:
  port: ${PORT:8086}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: fantasy-db-service
    version: ${APP_VERSION:dev}
