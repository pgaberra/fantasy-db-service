# Profile: local — run against the local docker-compose Postgres.
#   SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
# The credentials below are the docker-compose dev values (already public in
# docker-compose.yml) — not secrets. Flyway stays enabled (inherited from
# application.yaml) so local runs manage the local schema.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fantasy
    username: fantasy
    password: fantasy
