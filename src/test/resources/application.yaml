spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

projections:
  current-season: "20262027"

# Non-secret dummy key so the context boots (the filter requires a key). Slice tests that
# don't care about auth use @AutoConfigureMockMvc(addFilters = false); full-context tests that
# call a protected endpoint send this value in the X-Internal-Api-Key header.
internal:
  api-key: test-internal-key
